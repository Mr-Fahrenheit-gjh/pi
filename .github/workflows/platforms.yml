name: Windows and Linux

on:
  push:
    branches: [pi-web]
    paths-ignore: ["README*.md", "docs/**", "AGENTS.md", "CONTEXT.md"]
  pull_request:
    branches: [pi-web]
    paths-ignore: ["README*.md", "docs/**", "AGENTS.md", "CONTEXT.md"]

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: node --test lib/start-custom.test.mjs lib/public-distribution.test.mjs
      - run: node bin/start-custom.js --prepare
      - run: npm run test:platform
      - run: node e2e/public-start.mjs
